<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Trailer Shop">
  <title>LWH Trailer Shop</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="tb-left">
      <div class="tb-mark">LW</div>
      <div>
        <div class="tb-title">Trailer Shop</div>
        <div class="tb-sub" id="tbSub">Logistics Warehouse</div>
      </div>
    </div>
    <div class="tb-right">
      <button class="tb-btn" id="btnRefresh" title="Refresh" aria-label="Refresh">⟳</button>
      <button class="tb-btn tb-text" id="btnSwitch" hidden>Switch</button>
    </div>
  </header>

  <main>
    <!-- TECH: PICK NAME -->
    <section class="screen" id="scrTechLogin">
      <div class="wrap narrow">
        <div class="card">
          <div class="card-h">Tech Portal</div>
          <div class="card-b">
            <label class="lbl" for="techSelect">Select your name</label>
            <select id="techSelect" class="big"><option value="">Loading staff…</option></select>
            <div class="pill-note" id="techBadge" hidden></div>
            <button class="btn red block" id="techGo" disabled>View my jobs →</button>
          </div>
        </div>
        <div class="wx-line" id="wxLine"></div>
        <p class="muted" style="margin-top:18px;font-size:13px">Managers: inspections, work orders and shop reports are in the Transportation Manager app.</p>
      </div>
    </section>

    <!-- TECH: JOBS / RECENT -->
    <section class="screen" id="scrTech" hidden>
      <div class="tabs" id="techTabs">
        <button class="tab active" data-ttab="jobs">My Jobs</button>
        <button class="tab" data-ttab="recent">Recent Work</button>
      </div>
      <div class="wrap">
        <div id="techJobs"></div>
        <div id="techRecent" hidden></div>
      </div>
    </section>

    <!-- TECH: REPAIR -->
    <section class="screen" id="scrRepair" hidden>
      <div class="subbar">
        <button class="btn ghost-dark sm" id="repairBack">‹ Jobs</button>
        <div class="subbar-info"><b id="repairTitle">Trailer</b><span id="repairSub"></span></div>
      </div>
      <div class="wrap" id="repairBody"></div>
    </section>

  </main>

  <!-- Work order viewer -->
  <div class="docview" id="docView" hidden>
    <div class="docbar">
      <b id="docTitle">Work order</b>
      <div><button class="btn red sm" id="docPrint">Print / Save PDF</button><button class="btn outline-light sm" id="docClose">Close</button></div>
    </div>
    <iframe id="docFrame" title="Work order"></iframe>
  </div>

  <div class="toast" id="toast" hidden></div>
  <div class="busy" id="busy" hidden><div class="spinner"></div><div id="busyMsg">Loading…</div></div>

  <script src="config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/tech.js"></script>
  <script src="js/app.js"></script>
<!-- LWH-USAGE-START: anonymous app-usage ping (see hub.logisticswarehouse.net/usage/) -->
<script>
(function () {
  var APP = 'Trailer Shop';
  var URL_ = 'https://tjivcqxnkftujceumdtx.supabase.co/rest/v1/rpc/log_app_usage';
  var KEY = 'sb_publishable_PYlWSW6-Gi-QZl91IXUq0Q_W5mO3sDT';
  var ls = {}; try { ls = window.localStorage || {}; } catch (e) {}
  function get(k) { try { return ls.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { ls.setItem(k, v); } catch (e) {} }
  var dev = get('lwhUsageDev');
  if (!dev) { dev = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2)); set('lwhUsageDev', dev); }
  var standalone = !!((window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone);
  function queue() { try { return JSON.parse(get('lwhUsageQ') || '[]'); } catch (e) { return []; } }
  function send(row) {
    return fetch(URL_, { method: 'POST', keepalive: true, headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(row) })
      .then(function (r) { if (!r.ok) throw 0; });
  }
  function flush() {
    var q = queue(); if (!q.length || !navigator.onLine) return;
    set('lwhUsageQ', '[]');
    q.forEach(function (row) { send(row).catch(function () { var r = queue(); r.push(row); set('lwhUsageQ', JSON.stringify(r.slice(-50))); }); });
  }
  function track(event) {
    var row = { p_app: APP, p_event: event || 'open', p_device: dev, p_path: location.pathname, p_standalone: standalone, p_at: new Date().toISOString() };
    send(row).then(flush).catch(function () { var q = queue(); q.push(row); set('lwhUsageQ', JSON.stringify(q.slice(-50))); });
  }
  window.lwhTrack = track; // optional: lwhTrack('bol_created') to count a feature
  var last = Date.now(); track('open');
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && Date.now() - last > 30 * 60 * 1000) { last = Date.now(); track('open'); }
  });
  window.addEventListener('online', flush);
})();
</script>
<!-- LWH-USAGE-END -->
</body>
</html>
