<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Trailer Shop">
  <title>LWH Trailer Shop</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="tb-left">
      <div class="tb-mark">LW</div>
      <div>
        <div class="tb-title">Trailer Shop</div>
        <div class="tb-sub" id="tbSub">Logistics Warehouse</div>
      </div>
    </div>
    <div class="tb-right">
      <button class="tb-btn" id="btnRefresh" title="Refresh" aria-label="Refresh">⟳</button>
      <button class="tb-btn tb-text" id="btnSwitch" hidden>Switch</button>
    </div>
  </header>

  <main>
    <!-- TECH: PICK NAME -->
    <section class="screen" id="scrTechLogin">
      <div class="wrap narrow">
        <div class="card">
          <div class="card-h">Tech Portal</div>
          <div class="card-b">
            <label class="lbl" for="techSelect">Select your name</label>
            <select id="techSelect" class="big"><option value="">Loading staff…</option></select>
            <div class="pill-note" id="techBadge" hidden></div>
            <button class="btn red block" id="techGo" disabled>View my jobs →</button>
          </div>
        </div>
        <div class="wx-line" id="wxLine"></div>
        <p class="muted" style="margin-top:18px;font-size:13px">Managers: inspections, work orders and shop reports are in the Transportation Manager app.</p>
      </div>
    </section>

    <!-- TECH: JOBS / RECENT -->
    <section class="screen" id="scrTech" hidden>
      <div class="tabs" id="techTabs">
        <button class="tab active" data-ttab="jobs">My Jobs</button>
        <button class="tab" data-ttab="recent">Recent Work</button>
      </div>
      <div class="wrap">
        <div id="techJobs"></div>
        <div id="techRecent" hidden></div>
      </div>
    </section>

    <!-- TECH: REPAIR -->
    <section class="screen" id="scrRepair" hidden>
      <div class="subbar">
        <button class="btn ghost-dark sm" id="repairBack">‹ Jobs</button>
        <div class="subbar-info"><b id="repairTitle">Trailer</b><span id="repairSub"></span></div>
      </div>
      <div class="wrap" id="repairBody"></div>
    </section>

  </main>

  <!-- Work order viewer -->
  <div class="docview" id="docView" hidden>
    <div class="docbar">
      <b id="docTitle">Work order</b>
      <div><button class="btn red sm" id="docPrint">Print / Save PDF</button><button class="btn outline-light sm" id="docClose">Close</button></div>
    </div>
    <iframe id="docFrame" title="Work order"></iframe>
  </div>

  <div class="toast" id="toast" hidden></div>
  <div class="busy" id="busy" hidden><div class="spinner"></div><div id="busyMsg">Loading…</div></div>

  <script src="config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/tech.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
